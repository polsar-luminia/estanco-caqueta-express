name: Tests

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master]

jobs:
  unit:
    name: Unit tests + typecheck + lint + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # M-OBS-26: lint hard-fail (eslint . con flat config v9)
      - name: Lint
        run: npm run lint

      # M-OBS-26: audit runtime deps — falla en high o critical.
      # postcss moderate transitive de expo SDK 54 no tiene fix sin downgrade; se omite (moderate < high).
      - name: Audit (runtime deps)
        run: npm audit --audit-level=high --omit=dev

      - name: Unit tests
        run: npm run test

      - name: Type-check
        run: npx tsc --noEmit

      # M-OBS-26: expo-doctor verifica compatibilidad SDK Expo
      - name: Expo doctor
        run: npx expo-doctor
