# Flow end-to-end: login → agregar producto → carrito → confirmar pedido
# Uso: maestro test .maestro/flow-pedido.yaml
# Requiere cuenta test: 3001234567 / testpass
#
# M-OBS-27: este flow es DESTRUCTIVO (crea un pedido real).
# Para ejecutar contra producción se aborta con error. Setea
# MAESTRO_ENV=staging (o no lo setees) cuando corras local/CI.
appId: co.estancocaqueta.express
---
# Guard: bloquea ejecución si MAESTRO_ENV=production
- evalScript: |
    ${
      (() => {
        if (MAESTRO_ENV === 'production') {
          throw new Error('flow-pedido.yaml es destructivo (crea pedido real). Abortado: MAESTRO_ENV=production. Setea MAESTRO_ENV=staging para ejecutar contra ambiente de pruebas.');
        }
      })()
    }

- launchApp:
    clearState: true

# Login
- assertVisible: "Bienvenido"
- tapOn:
    id: "input-telefono"
- inputText: "3001234567"
- tapOn:
    id: "input-password"
- inputText: "testpass"
- tapOn: "Iniciar sesión"
- assertVisible:
    text: "Hola"
    timeout: 5000

# Home → tocar primer producto destacado
- tapOn:
    below: "Destacados"
    index: 0

# Detalle de producto → agregar al carrito
- assertVisible: "Agregar al carrito"
- tapOn: "Agregar al carrito"
- assertVisible:
    text: "Agregado al carrito"
    timeout: 3000

# Ir al carrito
- tapOn:
    id: "tab-cart"
- assertVisible: "Confirmar pedido"

# Verificar dirección predeterminada y confirmar
- assertVisible:
    text: "Confirmar pedido"
    enabled: true
- tapOn: "Confirmar pedido"
- assertVisible:
    text: "Pedido confirmado"
    timeout: 10000

# Historial de pedidos
- tapOn:
    id: "tab-orders"
- assertVisible:
    text: "Pedido #"
    timeout: 5000
