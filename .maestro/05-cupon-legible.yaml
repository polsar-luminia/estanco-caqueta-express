# Aplicar un cupón inválido y uno válido: el mensaje debe LEERSE.
#
# Qué fallo caza: la combinación de los dos incidentes de julio-2026 — errores
# enmascarados como "Error NNN" y el cupón envio_gratis que descontaba de más.
# Un código inexistente tiene que decir "Cupon no encontrado" (texto real del
# backend, marcado mostrable), no un número de status.
#
# No confirma el pedido (deja el carrito armado): así no choca con el guard
# de 60 segundos si se corre justo después del flujo 03.
appId: co.estancocaqueta.express
---
- evalScript: |
    ${
      (() => {
        const seguros = ['staging', 'local', 'ci', 'dev'];
        if (!seguros.includes(MAESTRO_ENV)) {
          throw new Error('05-cupon-legible necesita el backend de pruebas. Abortado: MAESTRO_ENV=' + (MAESTRO_ENV || 'undefined'));
        }
      })()
    }

- launchApp:
    clearState: true

# iOS: el dialogo de App Tracking Transparency aparece en el primer arranque
# y tapa toda la app. Se responde "no rastrear" (la opcion conservadora; los
# flujos no prueban tracking). En Android el paso no matchea y sigue de largo.
- runFlow:
    when:
      visible: "Solicitar a la app no rastrear"
    commands:
      - tapOn: "Solicitar a la app no rastrear"

# Arranque en el login en vez del catalogo: en iOS el token viejo sobrevive en el
# Keychain a `clearState`, la app intenta restaurar la sesion, el servidor la
# rechaza (revocada) y redirige al login. Se vuelve al catalogo, que es el
# estado de invitado que esperan los flujos.
- runFlow:
    when:
      visible: "Volver al catálogo"
    commands:
      - tapOn: "Volver al catálogo"

# El primer bundle de Metro en frio puede tardar minutos: esperar a que la UI
# real exista antes de tocar nada. Se espera el accessibilityLabel del header y
# no el placeholder del buscador: iOS no expone los placeholders en el arbol de
# accesibilidad, asi que "Busca tu licor favorito" solo matchea en Android.
- extendedWaitUntil:
    visible: "Buscar productos"
    timeout: 180000

# Arranque en frio: el catalogo se pide mientras el bundle todavia carga y el
# timeout de 10 s de apiFetch alcanza a vencer. Es estado de red, no un bug:
# se reintenta como haria una persona.
- runFlow:
    when:
      visible: "Reintentar la carga"
    commands:
      - tapOn: "Reintentar la carga"
      - extendedWaitUntil:
          notVisible: "No pudimos cargar el catálogo"
          timeout: 30000

- runFlow: lib/login.yaml

# Armar un carrito (el cupón se valida con subtotal > 0)
# La barra del home navega a la pantalla de busqueda (el tab "Buscar" es
# ambiguo para el matcher: choca con "Buscar productos" del header).
- tapOn: "Buscar productos"
- extendedWaitUntil:
    visible: "Buscar licores o snacks"
    timeout: 10000
- tapOn: "Buscar licores o snacks"
- inputText: "Aguardiente"
- extendedWaitUntil:
    visible: "Aguardiente Amarillo 375ml.*"
    timeout: 10000
- tapOn:
    point: "50%,12%"
- tapOn: "Aguardiente Amarillo 375ml.*"
- extendedWaitUntil:
    visible: "Agregar \\d+ al carrito.*"
    timeout: 10000
# OJO: este tap solo funciona porque Metro corre con EXPO_PUBLIC_E2E=1. Sin
# eso, el toast de LogBox ("Open debugger...") se dibuja ENCIMA de esta barra
# fija y se traga el tap sin que Maestro lo note (el paso sale COMPLETED).
- tapOn: "Agregar \\d+ al carrito.*"
# Al agregar aparece la barra "TU PEDIDO / VER CARRITO": camino directo al carrito.
- extendedWaitUntil:
    visible: "VER CARRITO"
    timeout: 8000
- tapOn: "VER CARRITO"

# Primero el cupón VÁLIDO: queda aplicado (aparece "Quitar cupón").
- scrollUntilVisible:
    element: "CODIGO"
- tapOn: "CODIGO"
- inputText: "PRUEBA10"
# DOS taps a proposito, no es descuido. Con el teclado abierto, el primer toque
# sobre el carrito lo consume el cierre del teclado y NUNCA llega al boton: el
# paso sale COMPLETED y no se llama a /cupones/validar (verificado con el log de
# rutas del servidor de pruebas). El segundo si lo activa. `handleValidarCupon`
# corta solo si el codigo esta vacio o ya es el aplicado, asi que el tap de mas
# es inofensivo.
- tapOn: "Aplicar cupón"
- tapOn: "Aplicar cupón"
- extendedWaitUntil:
    visible: "Quitar cupón"
    timeout: 10000

# Quitarlo deja el campo limpio (eraseText de Maestro dejaba residuos), y de
# paso verifica que el cupón se puede remover.
- tapOn: "Quitar cupón"
- extendedWaitUntil:
    visible: "CODIGO"
    timeout: 10000

# Cupón inválido: mensaje real, no "Error 404" ni "Servicio no disponible"
- tapOn: "CODIGO"
- inputText: "INVALIDO-999"
# DOS taps a proposito, no es descuido. Con el teclado abierto, el primer toque
# sobre el carrito lo consume el cierre del teclado y NUNCA llega al boton: el
# paso sale COMPLETED y no se llama a /cupones/validar (verificado con el log de
# rutas del servidor de pruebas). El segundo si lo activa. `handleValidarCupon`
# corta solo si el codigo esta vacio o ya es el aplicado, asi que el tap de mas
# es inofensivo.
- tapOn: "Aplicar cupón"
- tapOn: "Aplicar cupón"
- extendedWaitUntil:
    visible: "Cupon no encontrado"
    timeout: 10000
- assertNotVisible: "Error 404"
- assertNotVisible: "Servicio no disponible.*"
