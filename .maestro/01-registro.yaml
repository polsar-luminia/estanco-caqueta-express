# Registro completo → confirmar edad → pantalla de dirección → catálogo.
#
# Qué fallo caza: el onboarding es el paso más caro del funnel. Este flujo
# verifica ADEMÁS que "Lo hago después, ir al catálogo" en la pantalla de dirección funciona:
# si esa salida se rompe, el usuario nuevo queda ATRAPADO sin llegar jamás
# al catálogo, y ningún test unitario lo nota.
#
# DESTRUCTIVO (crea una cuenta): default-deny igual que el resto de flujos.
# Solo corre contra el servidor local de pruebas (MAESTRO_ENV=local).
appId: co.estancocaqueta.express
---
- evalScript: |
    ${
      (() => {
        const seguros = ['staging', 'local', 'ci', 'dev'];
        if (!seguros.includes(MAESTRO_ENV)) {
          throw new Error('01-registro crea una cuenta. Abortado: MAESTRO_ENV=' + (MAESTRO_ENV || 'undefined'));
        }
        // Teléfono único por corrida: el registro rechaza teléfonos repetidos.
        output.telefono = '3' + String(Date.now()).slice(-9);
      })()
    }

- launchApp:
    clearState: true

# iOS: el dialogo de App Tracking Transparency aparece en el primer arranque
# y tapa toda la app. Se responde "no rastrear" (la opcion conservadora; los
# flujos no prueban tracking). En Android el paso no matchea y sigue de largo.
- runFlow:
    when:
      visible: "Solicitar a la app no rastrear"
    commands:
      - tapOn: "Solicitar a la app no rastrear"

# Arranque en el login en vez del catalogo: en iOS el token viejo sobrevive en el
# Keychain a `clearState`, la app intenta restaurar la sesion, el servidor la
# rechaza (revocada) y redirige al login. Se vuelve al catalogo, que es el
# estado de invitado que esperan los flujos.
- runFlow:
    when:
      visible: "Volver al catálogo"
    commands:
      - tapOn: "Volver al catálogo"

# El primer bundle de Metro en frio puede tardar minutos: esperar a que la UI
# real exista antes de tocar nada. Se espera el accessibilityLabel del header y
# no el placeholder del buscador: iOS no expone los placeholders en el arbol de
# accesibilidad, asi que "Busca tu licor favorito" solo matchea en Android.
- extendedWaitUntil:
    visible: "Buscar productos"
    timeout: 180000

# Arranque en frio: el catalogo se pide mientras el bundle todavia carga y el
# timeout de 10 s de apiFetch alcanza a vencer. Es estado de red, no un bug:
# se reintenta como haria una persona.
- runFlow:
    when:
      visible: "Reintentar la carga"
    commands:
      - tapOn: "Reintentar la carga"
      - extendedWaitUntil:
          notVisible: "No pudimos cargar el catálogo"
          timeout: 30000

# Invitado → REGISTRO.
#
# Desde el 18-ago-2026 (d2df8ac "el invitado va a REGISTRO, no a login") tocar
# "Mi perfil" sin sesion cae DIRECTO en el formulario de registro. Antes caia en
# el login y habia que tocar "Crear una cuenta nueva"; ese rodeo ya no existe.
# Este flujo no se actualizo entonces, asi que llevaba desde esa fecha fallando
# en su primer paso — y como la suite tampoco se podia correr (el esquema del
# arnes estaba viejo y el inicio ni cargaba), nadie lo supo.
#
# Se contempla igual el resto de estados posibles, que siguen siendo reales:
# una sesion viva (en iOS el Keychain sobrevive a clearState) deja el PERFIL, y
# un token revocado deja el LOGIN.
- tapOn: "Abrir mi perfil"

- runFlow:
    when:
      notVisible: "Crea tu cuenta gratis"
    commands:
      # No estamos en el registro. Si tampoco hay login a la vista, es el perfil
      # con sesion viva: cerrarla. El boton vive bajo el pliegue, por eso el
      # scroll antes del tap.
      - runFlow:
          when:
            notVisible: "Iniciar sesión"
          commands:
            - scrollUntilVisible:
                element: "Cerrar sesión y salir de mi cuenta"
            - tapOn: "Cerrar sesión y salir de mi cuenta"
            - tapOn: "Sí"
      # Si quedamos en el login, de ahi al registro.
      - runFlow:
          when:
            visible: "Iniciar sesión"
          commands:
            - tapOn: "Crear una cuenta nueva"

- assertVisible: "Crea tu cuenta gratis"

# Formulario de registro (los placeholders son los selectores estables)
- tapOn:
    below: "Nombre Completo"
- inputText: "Cliente Maestro"
- tapOn:
    point: "50%,12%"
- tapOn:
    below: "Número de Teléfono"
- inputText: ${output.telefono}
- tapOn:
    point: "50%,12%"
- tapOn:
    below: "Contraseña"
- inputText: "password-maestro-8"
- tapOn:
    point: "50%,12%"
- tapOn:
    below: "Fecha de Nacimiento"
- inputText: "10/05/1990"
- tapOn:
    point: "50%,12%"
- tapOn: "Crear cuenta"

# Confirmación de mayoría de edad (Apple §1.4.3)
- extendedWaitUntil:
    visible: "Confirma tu mayoría de edad"
    timeout: 10000
- tapOn: "Confirmar que soy mayor de 18 años"

# Pantalla de dirección: DEBE poder saltarse sin quedar atrapado
- extendedWaitUntil:
    visible: "Lo hago después, ir al catálogo"
    timeout: 10000
- tapOn: "Lo hago después, ir al catálogo"

# Catálogo: la señal de que el onboarding terminó de verdad
- extendedWaitUntil:
    visible: "Inicio"
    timeout: 10000
- assertNotVisible: "Lo hago después, ir al catálogo"
